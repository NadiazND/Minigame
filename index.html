<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Pasang Niat Sholat - Edisi Ceria</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --bg-color: #E0F7FA;
            --card-bg: #FFFFFF;
            --primary: #4DD0E1;
            --primary-dark: #0097A7;
            --success: #AED581;
            --success-dark: #7CB342;
            --wrong: #FFAB91;
            --wrong-dark: #D84315;
            --text-main: #37474F;
            --text-sub: #78909C;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#B2EBF2 3px, transparent 3px);
            background-size: 20px 20px;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Mencegah scroll body, kita scroll konten game saja */
        }

        /* Container Utama */
        .game-wrapper {
            width: 100%;
            max-width: 600px; /* Sedikit lebih lebar untuk desktop */
            height: 100%;
            max-height: 900px;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            border-radius: 0;
            position: relative;
        }

        @media (min-width: 600px) {
            .game-wrapper {
                height: 95vh;
                border-radius: 25px;
                border: 4px solid #B2EBF2;
            }
        }

        /* --- HEADER / HUD --- */
        .header {
            padding: 15px 20px;
            background: #FFFFFF;
            border-bottom: 3px solid #E0F7FA;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 25px 25px 0 0;
            z-index: 10;
        }

        .badge {
            background: #FFF3E0;
            color: #FF6F00;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 3px solid #FFE0B2;
        }

        .lives-container {
            font-size: 1.4rem;
            letter-spacing: 2px;
        }

        /* --- AREA MAIN --- */
        .instruction {
            text-align: center;
            padding: 15px 10px 5px;
            color: var(--text-sub);
            font-size: 1rem;
            font-weight: 500;
        }

        .game-board {
            flex: 1;
            padding: 15px;
            display: grid;
            grid-template-columns: 1fr 1.5fr; /* Kiri lebih kecil, Kanan (teks) lebih lebar */
            gap: 12px;
            overflow-y: auto; /* Scrollable jika konten panjang */
            align-content: start;
        }

        /* Custom Scrollbar agar rapi */
        .game-board::-webkit-scrollbar { width: 6px; }
        .game-board::-webkit-scrollbar-thumb { background-color: #CFD8DC; border-radius: 10px; }

        .column {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* --- KARTU --- */
        .card {
            background: var(--card-bg);
            border: 2px solid #ECEFF1;
            border-bottom: 5px solid #CFD8DC; /* Efek 3D */
            border-radius: 15px;
            cursor: pointer;
            position: relative;
            transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 85px; /* Tinggi minimal kartu */
        }

        .card:active {
            transform: translateY(3px);
            border-bottom-width: 2px;
        }

        /* Style Kartu Kiri (Nama) */
        .card-left { padding: 8px; }
        .card-left .icon { font-size: 2rem; line-height: 1; margin-bottom: 4px; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.1)); }
        .card-left .label { font-size: 1rem; color: var(--text-main); font-weight: 700; }

        /* Style Kartu Kanan (Niat) */
        .card-right {
            align-items: flex-start;
            padding: 12px;
            text-align: left;
        }
        .card-right .hint { font-size: 0.7rem; color: #B0BEC5; font-weight: 700; text-transform: uppercase; margin-bottom: 2px; }
        .card-right .text-niat {
            font-family: 'Nunito', sans-serif; /* Font lebih mudah dibaca untuk teks panjang */
            font-size: 0.95rem;
            font-weight: 700;
            color: #546E7A;
            line-height: 1.3;
        }

        /* --- STATES (Selected, Match, Wrong) --- */
        .card.selected {
            background: #E1F5FE;
            border-color: #29B6F6;
            border-bottom-color: #0288D1;
            transform: translateY(1px);
        }

        .card.match {
            background: #F1F8E9 !important;
            border-color: #8BC34A !important;
            border-bottom-color: #689F38 !important;
            color: #33691E;
            opacity: 0;
            pointer-events: none;
            transform: scale(0.9);
            transition: transform 0.3s, opacity 0.5s ease 0.3s;
        }

        .card.wrong {
            background: #FBE9E7 !important;
            border-color: #FF7043 !important;
            border-bottom-color: #D84315 !important;
            animation: shake 0.4s;
        }

        /* --- MOBILE TWEAKS --- */
        @media (max-width: 400px) {
            .game-board { gap: 8px; padding: 10px; }
            .card { min-height: 70px; border-radius: 12px; border-bottom-width: 4px; }
            .card-left .icon { font-size: 1.6rem; }
            .card-left .label { font-size: 0.85rem; }
            .card-right .text-niat { font-size: 0.8rem; }
            .badge { font-size: 0.9rem; padding: 5px 10px; }
        }

        /* --- MODAL (Pop Up Menang/Kalah) --- */
        .modal-overlay {
            position: absolute; inset: 0;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            animation: fadeIn 0.3s;
            border-radius: inherit;
        }
        .modal-card {
            background: white;
            padding: 30px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: 4px solid #B2EBF2;
            width: 80%;
            max-width: 350px;
            animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-emoji { font-size: 4rem; margin-bottom: 10px; display: block; }
        .modal-title { margin: 0; color: var(--text-main); font-size: 1.5rem; }
        .modal-text { color: var(--text-sub); margin: 10px 0 25px; font-size: 1rem; }
        
        .btn-action {
            background: var(--primary);
            color: white;
            border: none;
            border-bottom: 4px solid var(--primary-dark);
            padding: 12px 24px;
            border-radius: 50px;
            font-family: inherit;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s;
            width: 100%;
        }
        .btn-action:active { transform: translateY(4px); border-bottom-width: 0; margin-top: 4px; }

        /* --- ANIMATIONS --- */
        @keyframes shake { 0%,100% {transform:translateX(0)} 25%{transform:translateX(-5px) rotate(-5deg)} 75%{transform:translateX(5px) rotate(5deg)} }
        @keyframes fadeIn { from {opacity:0} to {opacity:1} }
        @keyframes bounceIn { 
            0% { transform: scale(0.5); opacity: 0; }
            60% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div class="header">
            <div class="badge">
                <span>⭐</span> <span id="score">0</span>
            </div>
            <div class="lives-container" id="lives">
                ❤️❤️❤️
            </div>
        </div>

        <div class="instruction">
            Pasangkan <b>Nama Sholat</b> dengan <b>Niatnya</b>! 👇
        </div>

        <div class="game-board">
            <div class="column" id="col-left"></div>
            <div class="column" id="col-right"></div>
        </div>

        <div class="modal-overlay" id="modal">
            <div class="modal-card">
                <span class="modal-emoji" id="modal-emoji">🏆</span>
                <h2 class="modal-title" id="modal-title">Hebat!</h2>
                <p class="modal-text" id="modal-msg">Kamu berhasil!</p>
                <button class="btn-action" onclick="initGame()">Main Lagi 🚀</button>
            </div>
        </div>
    </div>

    <script>
        const gameData = [
            { 
                id: 'subuh', 
                name: 'Subuh', 
                icon: '🌅', 
                text: 'Ushalli fardhash-Shubhi rak\'ataini...',
                color: '#4DD0E1'
            },
            { 
                id: 'zuhur', 
                name: 'Zuhur', 
                icon: '☀️', 
                text: 'Ushalli fardhaz-Zhuhri arba\'a...',
                color: '#FFB74D' 
            },
            { 
                id: 'ashar', 
                name: 'Ashar', 
                icon: '⛅', 
                text: 'Ushalli fardhal-\'Ashri arba\'a...',
                color: '#FF8A65' 
            },
            { 
                id: 'maghrib', 
                name: 'Maghrib', 
                icon: '🌇', 
                text: 'Ushalli fardhal-Maghribi tsalaatsa...',
                color: '#64B5F6' 
            },
            { 
                id: 'isya', 
                name: 'Isya', 
                icon: '🌙', 
                text: 'Ushalli fardhal-\'Isyaa-i arba\'a...',
                color: '#9575CD' 
            }
        ];

        let score = 0;
        let lives = 3;
        let matches = 0;
        let selectedL = null;
        let selectedR = null;
        let isProcessing = false; // Mencegah klik spam

        const colL = document.getElementById('col-left');
        const colR = document.getElementById('col-right');
        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');
        const modal = document.getElementById('modal');

        function initGame() {
            score = 0;
            lives = 3;
            matches = 0;
            selectedL = null;
            selectedR = null;
            isProcessing = false;
            
            updateHUD();
            modal.style.display = 'none';
            renderBoard();
        }

        function updateHUD() {
            // Animasi angka naik (opsional, sederhana saja di sini)
            scoreEl.innerText = score;
            
            // Render nyawa
            let heartHTML = '';
            for(let i=0; i<3; i++) {
                heartHTML += i < lives ? '❤️' : '<span style="opacity:0.3; filter:grayscale(1)">❤️</span>';
            }
            livesEl.innerHTML = heartHTML;
        }

        function renderBoard() {
            colL.innerHTML = '';
            colR.innerHTML = '';

            // Acak kartu
            let leftData = [...gameData].sort(() => Math.random() - 0.5);
            let rightData = [...gameData].sort(() => Math.random() - 0.5);

            // Render Kiri
            leftData.forEach(item => {
                const el = document.createElement('div');
                el.className = 'card card-left';
                el.dataset.id = item.id;
                // Sedikit style inline untuk hint warna border
                el.style.borderLeft = `5px solid ${item.color}`;
                el.innerHTML = `
                    <div class="icon">${item.icon}</div>
                    <div class="label">${item.name}</div>
                `;
                el.onclick = () => handleSelect(el, 'left');
                colL.appendChild(el);
            });

            // Render Kanan
            rightData.forEach(item => {
                const el = document.createElement('div');
                el.className = 'card card-right';
                el.dataset.id = item.id;
                el.innerHTML = `
                    <div class="hint">Niat Latin:</div>
                    <div class="text-niat">"${item.text}"</div>
                `;
                el.onclick = () => handleSelect(el, 'right');
                colR.appendChild(el);
            });
        }

        function handleSelect(card, side) {
            // Validasi: Game over, sedang proses animasi, atau kartu sudah match
            if (lives <= 0 || isProcessing || card.classList.contains('match')) return;
            // Validasi: Klik kartu yang sama dua kali
            if ((side === 'left' && card === selectedL) || (side === 'right' && card === selectedR)) return;

            // Efek suara "tap" sederhana (opsional, visual only disini)
            
            if (side === 'left') {
                if (selectedL) selectedL.classList.remove('selected');
                selectedL = card;
            } else {
                if (selectedR) selectedR.classList.remove('selected');
                selectedR = card;
            }
            card.classList.add('selected');

            // Cek Match jika keduanya terpilih
            if (selectedL && selectedR) {
                checkMatch();
            }
        }

        function checkMatch() {
            isProcessing = true; // Kunci input sebentar
            const id1 = selectedL.dataset.id;
            const id2 = selectedR.dataset.id;

            if (id1 === id2) {
                // BENAR
                score += 20;
                matches++;
                
                selectedL.classList.remove('selected');
                selectedR.classList.remove('selected');
                selectedL.classList.add('match');
                selectedR.classList.add('match');

                // Confetti mini
                confetti({
                    particleCount: 30,
                    spread: 50,
                    origin: { y: 0.7 },
                    colors: ['#AED581', '#4DD0E1']
                });

                resetSelection();
                updateHUD();

                if (matches === gameData.length) {
                    setTimeout(() => showModal(true), 800);
                }
            } else {
                // SALAH
                lives--;
                selectedL.classList.add('wrong');
                selectedR.classList.add('wrong');
                updateHUD();

                setTimeout(() => {
                    selectedL.classList.remove('wrong', 'selected');
                    selectedR.classList.remove('wrong', 'selected');
                    resetSelection();
                    
                    if (lives <= 0) showModal(false);
                }, 600);
            }
        }

        function resetSelection() {
            selectedL = null;
            selectedR = null;
            isProcessing = false;
        }

        function showModal(win) {
            modal.style.display = 'flex';
            const title = document.getElementById('modal-title');
            const msg = document.getElementById('modal-msg');
            const emoji = document.getElementById('modal-emoji');

            if (win) {
                emoji.innerText = '🎉';
                title.innerText = 'Alhamdulillah!';
                msg.innerText = `Kamu hebat! Skor akhir: ${score}`;
                // Confetti Besar
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
            } else {
                emoji.innerText = '💪';
                title.innerText = 'Jangan Menyerah';
                msg.innerText = 'Yuk coba lagi sampai hafal!';
            }
        }

        // Start Game
        initGame();

    </script>
</body>
</html>
